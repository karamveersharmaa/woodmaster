<template>

    <section class="product-page">

        <div class="container">

            <!-- Back Button -->

            <div class="breadcrumb">

                <span
                    class="back-btn"
                    onclick={backToProducts}>

                    ← Back to Products

                </span>

            </div>

            <!-- Product Layout -->

            <div class="product-layout">

                <!-- LEFT SIDE -->

                <div class="image-section">

                    <div class="main-image">

                        <div class="dummy-image">

                            Image

                        </div>

                    </div>

                    <div class="thumbnail-section">

                        <div class="thumbnail active">1</div>

                        <div class="thumbnail">2</div>

                        <div class="thumbnail">3</div>

                        <div class="thumbnail">4</div>

                    </div>

                </div>

                <!-- RIGHT SIDE -->

                <div class="details-section">

                    <span class="product-category">

                        {product.material}

                    </span>

                    <h1 class="product-title">

                        {product.title}

                    </h1>

                    <div class="rating-row">

                        <span class="stars">

                            {ratingStars}

                        </span>

                        <span class="review-count">

                            (120 Reviews)

                        </span>

                    </div>

                    <div class="price">

                        {formattedPrice}

                    </div>

                    <div class="stock">

                        ✔ {stockStatus}

                    </div>

                    <div class="divider"></div>

                    <!-- Material -->

                    <div class="info-row">

                        <span class="label">

                            Material

                        </span>

                        <span class="value">

                            {product.material}

                        </span>

                    </div>

                    <!-- Product Id -->

                    <div class="info-row">

                        <span class="label">

                            Product ID

                        </span>

                        <span class="value">

                            {product.id}

                        </span>

                    </div>

                    <!-- Quantity -->

                    <div class="quantity-section">

                        <span class="label">

                            Quantity

                        </span>

                        <div class="quantity-box">

                            <button
                                class="qty-btn"
                                onclick={decreaseQty}>

                                -

                            </button>

                            <span class="qty">

                                {quantity}

                            </span>

                            <button
                                class="qty-btn"
                                onclick={increaseQty}>

                                +

                            </button>

                        </div>

                    </div>

                    <!-- Buttons -->

                    <div class="button-group">

                        <button
                            class="cart-btn"
                            onclick={addToCart}>

                            🛒 Add to Cart

                        </button>

                        <button
                            class="buy-btn"
                            onclick={buyNow}>

                            Buy Now

                        </button>

                    </div>

                </div>

            </div>

            <!-- Description -->

            <div class="description-section">

                <h2>

                    Product Description

                </h2>

                <p>

                    {product.description}

                </p>

            </div>

            <!-- Specifications -->

            <div class="specification-section">

                <h2>

                    Specifications

                </h2>

                <div class="spec-grid">

                    <div class="spec-card">

                        <span>Material</span>

                        <strong>{product.material}</strong>

                    </div>

                    <div class="spec-card">

                        <span>Rating</span>

                        <strong>{product.rating} / 5</strong>

                    </div>

                    <div class="spec-card">

                        <span>Availability</span>

                        <strong>{stockStatus}</strong>

                    </div>

                    <div class="spec-card">

                        <span>Product Code</span>

                        <strong>{product.id}</strong>

                    </div>

                </div>

            </div>

            <!-- Related Products -->

            <div class="related-products">

                <h2>

                    You May Also Like

                </h2>

                <div class="related-grid">

                    <div class="related-card">

                        Dining Table

                    </div>

                    <div class="related-card">

                        Wooden Door

                    </div>

                    <div class="related-card">

                        King Size Bed

                    </div>

                    <div class="related-card">

                        TV Unit

                    </div>

                </div>

            </div>

        </div>

    </section>

</template>
