<template>
    <section class="services" id="products">
        <div class="inner">

            <p class="eyebrow">⊢— Featured Products —⊣</p>

            <h2>
                Crafted Furniture for Every Corner of Your Home
            </h2>

            <div class="grid">

                <template for:each={items} for:item="item">

                    <article
                        class="card"
                        key={item.id}
                        data-id={item.id}
                        onclick={handleProductClick}>

                        <div class="image-container">
                            <div class="image-placeholder">
                                Image
                            </div>
                        </div>

                        <div class="content">

                            <h3>{item.title}</h3>

                            <p class="material">{item.material}</p>

                            <div class="price-rating">

                                <span class="price">
                                    ₹{item.price}
                                </span>

                                <span class="rating">
                                    ★★★★★
                                </span>

                            </div>

                            <button
                                class="cart-btn"
                                data-id={item.id}
                                onclick={handleAddToCart}>
                                Add to Cart
                            </button>

                        </div>

                    </article>

                </template>

            </div>

        </div>
    </section>
</template>
