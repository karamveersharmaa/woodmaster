<template>

    <!-- ===========================
         HOME PAGE
    ============================ -->

    <template if:true={isHomePage}>

        <wm-header
            oncartclick={handleCartClick}
            onexploreproducts={handleExploreProducts}>
        </wm-header>

        <main>

            <!-- Hero -->
            <wm-hero
                onplanfurniture={handlePlanFurniture}>
            </wm-hero>


            <!-- Plan Your Furniture -->

                <wm-plan-furniture
                    onbacktohome={handleBackToHome}
                    onexploreproducts={handleExploreProducts}>
                </wm-plan-furniture>


            <!-- Process -->
            <wm-process></wm-process>


            <!-- Gallery -->
            <wm-gallery></wm-gallery>


            <!-- Testimonials -->
            <wm-testimonials></wm-testimonials>


            <!-- About -->
            <wm-about></wm-about>

        </main>

        <wm-footer></wm-footer>

    </template>


    <!-- ===========================
         PRODUCTS PAGE
    ============================ -->

    <template if:true={isProductsPage}>

        <wm-header
            oncartclick={handleCartClick}>
        </wm-header>

        <main>

            <wm-services
                onproductclick={handleProductClick}>
            </wm-services>

        </main>

        <wm-footer></wm-footer>

    </template>


    <!-- ===========================
         PRODUCT DETAILS PAGE
    ============================ -->

    <template if:true={isProductDetailsPage}>

        <wm-product-details
            product={selectedProduct}
            onback={handleBackToProducts}
            onopencart={handleOpenCart}>
        </wm-product-details>

    </template>


    <!-- ===========================
         CART PAGE
    ============================ -->

    <template if:true={isCartPage}>

        <wm-cart
            onbacktohome={handleContinueShopping}>
        </wm-cart>

    </template>

</template>
