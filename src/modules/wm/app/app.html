<template>

    <!-- ===========================
         HOME PAGE
    ============================ -->

    <template if:true={isHomePage}>

        <wm-header oncartclick={handleCartClick}></wm-header>

        <main>

            <wm-hero></wm-hero>

            <wm-services
                onproductclick={handleProductClick}>
            </wm-services>

            <wm-process></wm-process>

            <wm-gallery></wm-gallery>

            <wm-testimonials></wm-testimonials>

            <wm-about></wm-about>

            <wm-contact></wm-contact>
            <!-- TEMPORARY TEST -->
    <button onclick={handleTestPlanFurniture}>
        Test Plan Your Furniture
    </button>
        </main>

        <wm-footer></wm-footer>

    </template>


    <!-- ===========================
         PRODUCT DETAILS PAGE
    ============================ -->

    <template if:true={isProductDetailsPage}>

        <wm-product-details
            product={selectedProduct}
            onback={handleBackToHome}
            onopencart={handleOpenCart}>
        </wm-product-details>

    </template>

     <!-- CART PAGE -->

    <template if:true={isCartPage}>

        <wm-cart
            onbacktohome={handleContinueShopping}> 
        </wm-cart>

    </template>
    <!-- TEMPORARY PLAN YOUR FURNITURE TEST -->

<template if:true={isPlanFurniturePage}>

    <wm-plan-furniture></wm-plan-furniture>

</template>

</template>
