<template>

    <!-- ===========================
         HOME PAGE
    ============================ -->

    <template if:true={isHomePage}>

        <wm-header></wm-header>

        <main>

            <wm-hero></wm-hero>

            <wm-services
                onproductclick={handleProductClick}>
            </wm-services>

            <wm-process></wm-process>

            <wm-gallery></wm-gallery>

            <wm-testimonials></wm-testimonials>

            <wm-about></wm-about>

            <wm-contact></wm-contact>

        </main>

        <wm-footer></wm-footer>

    </template>


    <!-- ===========================
         PRODUCT DETAILS PAGE
    ============================ -->

    <template if:true={isProductDetailsPage}>

        <wm-product-details
            product={selectedProduct}
            onback={handleBackToHome}>
        </wm-product-details>

    </template>

</template>
